[project]
name = "traffic-signs"
version = "0.1.0"
description = "Recunoașterea semnelor de circulație (GTSRB): CNN propriu vs. ResNet50, cu aplicație web"
authors = [
    { name = "GalanIonut", email = "93884682+GalanIonut@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "tensorflow>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
